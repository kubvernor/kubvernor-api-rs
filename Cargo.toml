[workspace]
members = [ "kubvernor-api"]
resolver = "2"

[workspace.package]
authors = ["Dawid Nowak <nowakd@gmail.com>"]
edition = "2024"
license = "MIT"
version = "0.2.0"
readme = "./README.md"
repository = "https://github.com/kubvernor/kubvernor-api-rs"

[workspace.dependencies]
anyhow = "1.0.100"
delegate = "0.13.5"
hyper-util = "0.1.18"
kube = { version = "2.0" }
k8s-openapi = { version = "0.26.0" }
once_cell = "1.21.3"
regex = { package = "regex-lite", version = "0.1.8" }
schemars = "1.1.0"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
tokio = { version = "1.48.0", features = ["full"] }
tower = { version = "0.5.2", features = ["limit"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
uuid = { version = "1.18.1", features = ["v4", "fast-rng"] }


