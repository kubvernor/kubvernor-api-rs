[workspace]
members = [ "kubvernor-api"]
resolver = "2"

[workspace.package]
authors = ["Dawid Nowak <nowakd@gmail.com>"]
edition = "2024"
license = "MIT"
version = "0.2.0"
readme = "./README.md"
repository = "https://github.com/kubvernor/kubvernor-api-rs"

[workspace.dependencies]
kube = { version = "3.0" }
k8s-openapi = { version = "0.27.0" }
schemars = "1.1.0"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }



